name: Ping Sentinel hourly

on:
  schedule:
    # Once an hour, away from the busiest minute at the top of the hour (UTC).
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sentinel-backend-health-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Sentinel liveness
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 5 --retry-max-time 200 \
            --output "$RUNNER_TEMP/sentinel-health.json" \
            --write-out 'Sentinel health: HTTP %{http_code} in %{time_total}s\n' \
            https://sentinel-sutr.onrender.com/actuator/health
          python - "$RUNNER_TEMP/sentinel-health.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response:
              health = json.load(response)
          if health.get("status") != "UP":
              raise SystemExit("Sentinel did not report UP")
          print("Sentinel is responding")
          PY
