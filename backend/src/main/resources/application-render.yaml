# Fresh presentation deployment. Share one free database using an isolated schema.
server:
  port: ${PORT:10000}
  shutdown: graceful
  forward-headers-strategy: native
spring:
  datasource:
    url: jdbc:postgresql://${RENDER_DB_HOST}:${RENDER_DB_PORT:5432}/${RENDER_DB_NAME}?currentSchema=sentinel
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/render
    schemas: sentinel
    default-schema: sentinel
    create-schemas: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
sentinel:
  seed-demo: false
  cors-origins: ${SENTINEL_CORS_ALLOWED_ORIGINS}
  registration-open: false
  jwt:
    secret: ${JWT_SECRET}
  ml:
    stub: false
  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY}
  hosted:
    public-base-url: ${SENTINEL_PUBLIC_BASE_URL}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoint:
    health:
      show-details: never
