server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sentinel-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sentinel}
    username: ${POSTGRES_USER:sentinel}
    password: ${POSTGRES_PASSWORD:sentinel_change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE_MB:10}MB
      max-request-size: ${UPLOAD_MAX_SIZE_MB:10}MB

sentinel:
  jwt:
    secret: ${JWT_SECRET:change_me_to_a_long_random_string_at_least_32_chars}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}
  ml:
    cv-base-url: ${CV_ML_BASE_URL:http://localhost:8001}
    transaction-base-url: ${TRANSACTION_ML_BASE_URL:http://localhost:8002}
    stub: ${SENTINEL_ML_STUB:true}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:10}
  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY:sentinel-dev-field-key-change-me}
  hosted:
    public-base-url: ${SENTINEL_PUBLIC_BASE_URL:http://localhost:5173}
    session-ttl-minutes: ${SENTINEL_KYC_SESSION_TTL_MINUTES:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    rabbit:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
    com.sentinel: INFO
