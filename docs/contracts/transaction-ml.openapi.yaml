# Transaction anomaly scoring — OpenAPI stub
openapi: 3.0.3
info:
  title: Sentinel Transaction ML Service
  version: 0.1.0-pilot
  description: Rules + gradient-boosted / anomaly model + SHAP feature attributions
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: OK
  /ml/transaction-score:
    post:
      summary: Rules + model score + SHAP top features
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    required: [amount, timestamp]
                    properties:
                      transactionId: { type: string }
                      amount: { type: number }
                      timestamp: { type: string, format: date-time }
                      location: { type: string }
                      channel: { type: string }
                      customerFeatures:
                        type: object
                        additionalProperties: true
      responses:
        "200":
          description: Per-transaction scores with explanations
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionScore"
components:
  schemas:
    ShapFeature:
      type: object
      properties:
        feature: { type: string }
        contribution: { type: number }
    TransactionScore:
      type: object
      properties:
        transactionId: { type: string }
        anomalyScore: { type: number, minimum: 0, maximum: 1 }
        modelScore: { type: number, minimum: 0, maximum: 1 }
        flagged: { type: boolean }
        ruleFlags:
          type: array
          items: { type: string }
        explanation: { type: string }
        shapTopFeatures:
          type: array
          items:
            $ref: "#/components/schemas/ShapFeature"
