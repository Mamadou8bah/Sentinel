<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" role="img" aria-labelledby="title">
  <title id="title">Technology stack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F0A"/>
      <stop offset="100%" stop-color="#141A12"/>
    </linearGradient>
  </defs>
  <rect width="880" height="120" rx="14" fill="url(#bg)"/>

  <!-- Java -->
  <g transform="translate(28,28)">
    <rect width="88" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <circle cx="24" cy="32" r="10" fill="none" stroke="#EA2D2E" stroke-width="2.5"/>
    <text x="42" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Java</text>
    <text x="42" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">17 / Spring</text>
    <rect x="0" y="0" width="88" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Python -->
  <g transform="translate(132,28)">
    <rect width="96" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <rect x="14" y="22" width="14" height="20" rx="3" fill="none" stroke="#3776AB" stroke-width="2"/>
    <text x="38" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Python</text>
    <text x="38" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">FastAPI</text>
    <rect x="0" y="0" width="96" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Postgres -->
  <g transform="translate(244,28)">
    <rect width="100" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <ellipse cx="24" cy="28" rx="10" ry="6" fill="none" stroke="#4169E1" stroke-width="2"/>
    <ellipse cx="24" cy="36" rx="10" ry="6" fill="none" stroke="#4169E1" stroke-width="2"/>
    <text x="42" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Postgres</text>
    <text x="42" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">SoR</text>
    <rect x="0" y="0" width="100" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- React -->
  <g transform="translate(360,28)">
    <rect width="92" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <circle cx="24" cy="32" r="4" fill="#61DAFB"/>
    <ellipse cx="24" cy="32" rx="14" ry="6" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(0 24 32)"/>
    <ellipse cx="24" cy="32" rx="14" ry="6" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(60 24 32)"/>
    <ellipse cx="24" cy="32" rx="14" ry="6" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(120 24 32)"/>
    <text x="44" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">React</text>
    <text x="44" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">TypeScript</text>
    <rect x="0" y="0" width="92" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Docker -->
  <g transform="translate(468,28)">
    <rect width="88" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <rect x="12" y="30" width="10" height="8" fill="#2496ED"/>
    <rect x="24" y="30" width="10" height="8" fill="#2496ED"/>
    <rect x="18" y="20" width="10" height="8" fill="#2496ED"/>
    <text x="42" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Docker</text>
    <text x="42" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">Compose</text>
    <rect x="0" y="0" width="88" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- XGBoost / SHAP -->
  <g transform="translate(572,28)">
    <rect width="120" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <path d="M14 42 L22 28 L30 36 L38 18" fill="none" stroke="#FF4515" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">XGBoost</text>
    <text x="48" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">SHAP</text>
    <rect x="0" y="0" width="120" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- PyTorch -->
  <g transform="translate(708,28)">
    <rect width="144" height="64" rx="10" fill="#1A2218" stroke="#3A4A36"/>
    <circle cx="26" cy="32" r="9" fill="none" stroke="#EE4C2C" stroke-width="2"/>
    <circle cx="26" cy="32" r="3" fill="#EE4C2C"/>
    <text x="44" y="28" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">PyTorch</text>
    <text x="44" y="44" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9">CV / signatures</text>
    <rect x="0" y="0" width="144" height="64" rx="10" fill="none" stroke="#FF4515" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
