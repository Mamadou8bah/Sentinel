<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">KYC and fraud decision flow</title>
  <desc id="desc">From bank channel through Sentinel risk engine to allow, review, or block.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F0A"/>
      <stop offset="100%" stop-color="#141A12"/>
    </linearGradient>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6 Z" fill="#8A9480"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="16" fill="url(#bg2)"/>
  <text x="28" y="36" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Decision pipeline</text>
  <text x="28" y="56" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">KYC · documents · payments converge on explainable risk</text>

  <!-- Steps -->
  <g>
    <rect x="28" y="100" width="140" height="72" rx="10" fill="#1A2218" stroke="#2E3A2A"/>
    <text x="48" y="132" fill="#FF6A33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">01</text>
    <text x="48" y="152" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Capture</text>
    <text x="48" y="168" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">ID / cheque / TX</text>
  </g>
  <g>
    <rect x="210" y="100" width="140" height="72" rx="10" fill="#1A2218" stroke="#2E3A2A"/>
    <text x="230" y="132" fill="#FF6A33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">02</text>
    <text x="230" y="152" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Infer</text>
    <text x="230" y="168" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">CV · rules · GBM</text>
  </g>
  <g>
    <rect x="392" y="100" width="140" height="72" rx="10" fill="#1A2218" stroke="#2E3A2A"/>
    <text x="412" y="132" fill="#FF6A33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">03</text>
    <text x="412" y="152" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Explain</text>
    <text x="412" y="168" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">SHAP · narrative</text>
  </g>
  <g>
    <rect x="574" y="100" width="140" height="72" rx="10" fill="#1A2218" stroke="#2E3A2A"/>
    <text x="594" y="132" fill="#FF6A33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">04</text>
    <text x="594" y="152" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Decide</text>
    <text x="594" y="168" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">ALLOW · REVIEW · BLOCK</text>
  </g>
  <g>
    <rect x="756" y="100" width="176" height="72" rx="10" fill="#1E291C" stroke="#FF4515"/>
    <text x="776" y="132" fill="#FF6A33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">05</text>
    <text x="776" y="152" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Govern</text>
    <text x="776" y="168" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Case · audit · notify</text>
  </g>

  <path d="M168 136 H210" stroke="#8A9480" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M350 136 H392" stroke="#8A9480" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M532 136 H574" stroke="#8A9480" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M714 136 H756" stroke="#8A9480" stroke-width="1.5" marker-end="url(#a2)"/>

  <circle r="4" fill="#FF4515">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M168 136 H210"/>
  </circle>
  <circle r="4" fill="#FF6A33">
    <animateMotion dur="3.5s" begin="0.7s" repeatCount="indefinite" path="M350 136 H392"/>
  </circle>
  <circle r="4" fill="#FF4515">
    <animateMotion dur="3.5s" begin="1.4s" repeatCount="indefinite" path="M532 136 H574"/>
  </circle>
  <circle r="4" fill="#FFB199">
    <animateMotion dur="3.5s" begin="2.1s" repeatCount="indefinite" path="M714 136 H756"/>
  </circle>

  <text x="28" y="230" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Fail-closed KYC: spoof or low quality never auto-verifies. Signature match requires an enrolled specimen.</text>
  <text x="28" y="250" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Payment path is synchronous; heavy CV work is async with status poll / webhook.</text>
</svg>
