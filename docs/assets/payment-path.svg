<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" role="img" aria-labelledby="title">
  <title id="title">Live request path animation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F0A"/>
      <stop offset="100%" stop-color="#141A12"/>
    </linearGradient>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6 Z" fill="#8A9480"/>
    </marker>
  </defs>
  <rect width="880" height="160" rx="14" fill="url(#bg)"/>
  <text x="28" y="32" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Payment-path latency loop</text>
  <text x="28" y="50" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Bank switch ’ Spring ’ TX-ML (rules + SHAP) ’ recommendation</text>

  <rect x="40" y="78" width="120" height="44" rx="8" fill="#1A2218" stroke="#2E3A2A"/>
  <text x="62" y="104" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Bank switch</text>

  <rect x="220" y="78" width="120" height="44" rx="8" fill="#1E291C" stroke="#FF4515"/>
  <text x="250" y="104" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Spring API</text>

  <rect x="400" y="78" width="120" height="44" rx="8" fill="#1A2218" stroke="#2E3A2A"/>
  <text x="432" y="104" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">TX-ML</text>

  <rect x="580" y="78" width="120" height="44" rx="8" fill="#1A2218" stroke="#2E3A2A"/>
  <text x="608" y="104" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Postgres</text>

  <rect x="740" y="78" width="100" height="44" rx="8" fill="#1A2218" stroke="#3D7A4A"/>
  <text x="762" y="104" fill="#8FCB9B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">ALLOW</text>

  <path d="M160 100 H220" stroke="#8A9480" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M340 100 H400" stroke="#8A9480" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M520 100 H580" stroke="#8A9480" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M700 100 H740" stroke="#8A9480" stroke-width="1.5" marker-end="url(#arr)"/>

  <circle r="5" fill="#FF4515">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M160 100 H220"/>
  </circle>
  <circle r="5" fill="#FF6A33">
    <animateMotion dur="3.2s" begin="0.6s" repeatCount="indefinite" path="M340 100 H400"/>
  </circle>
  <circle r="5" fill="#FFB199">
    <animateMotion dur="3.2s" begin="1.2s" repeatCount="indefinite" path="M520 100 H580"/>
  </circle>
  <circle r="5" fill="#8FCB9B">
    <animateMotion dur="3.2s" begin="1.8s" repeatCount="indefinite" path="M700 100 H740"/>
  </circle>

  <text x="40" y="148" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Sync on the payment path. Heavy CV work stays async off this loop.</text>
</svg>
