<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel system architecture</title>
  <desc id="desc">Bank channels and staff UI connect to Spring Boot, which calls CV and transaction ML services and stores state in PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F0A"/>
      <stop offset="100%" stop-color="#141A12"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4515"/>
      <stop offset="100%" stop-color="#FF6A33"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A9480"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg)"/>
  <text x="32" y="42" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Sentinel  system architecture</text>
  <text x="32" y="66" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Dual channel: bank systems (API key) and staff desk (JWT)</text>

  <!-- Bank channel -->
  <g filter="url(#soft)">
    <rect x="40" y="100" width="200" height="88" rx="12" fill="#1A2218" stroke="#2E3A2A"/>
    <circle cx="68" cy="130" r="12" fill="none" stroke="#FF4515" stroke-width="2"/>
    <path d="M62 130 h12 M68 124 v12" stroke="#FF4515" stroke-width="2"/>
    <text x="92" y="128" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Bank app / branch</text>
    <text x="92" y="148" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Customer channel</text>
    <text x="56" y="172" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">ID · selfie · payments</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="220" width="200" height="88" rx="12" fill="#1A2218" stroke="#2E3A2A"/>
    <rect x="56" y="242" width="18" height="14" rx="2" fill="none" stroke="#FF4515" stroke-width="2"/>
    <path d="M56 256 h18" stroke="#FF4515" stroke-width="2"/>
    <text x="92" y="252" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Bank core / switch</text>
    <text x="92" y="272" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Service credential</text>
    <text x="56" y="292" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">X-Api-Key · webhooks</text>
  </g>

  <!-- Staff -->
  <g filter="url(#soft)">
    <rect x="720" y="160" width="200" height="100" rx="12" fill="#1A2218" stroke="#2E3A2A"/>
    <rect x="740" y="186" width="16" height="12" rx="2" fill="none" stroke="#FF4515" stroke-width="2"/>
    <circle cx="748" cy="182" r="4" fill="none" stroke="#FF4515" stroke-width="2"/>
    <text x="768" y="196" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Staff ops desk</text>
    <text x="768" y="216" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">React · JWT · RBAC</text>
    <text x="740" y="240" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Cases · 360° · analytics</text>
  </g>

  <!-- Spring core -->
  <g filter="url(#soft)">
    <rect x="300" y="130" width="280" height="200" rx="14" fill="#1E291C" stroke="url(#ember)" stroke-width="2"/>
    <text x="320" y="162" fill="#FF6A33" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">SYSTEM OF RECORD</text>
    <text x="320" y="188" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Spring Boot API</text>
    <text x="320" y="212" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Auth · KYC · Documents · TX · Risk</text>
    <text x="320" y="230" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Cases · Audit · Integration</text>
    <rect x="320" y="250" width="110" height="28" rx="6" fill="#141C12" stroke="#3A4A36"/>
    <text x="336" y="268" fill="#C5D0BB" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">OpenAPI</text>
    <rect x="444" y="250" width="110" height="28" rx="6" fill="#141C12" stroke="#3A4A36"/>
    <text x="462" y="268" fill="#C5D0BB" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">WebSocket</text>
    <text x="320" y="310" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Multi-tenant · fail-closed KYC · explainable risk</text>
  </g>

  <!-- ML services -->
  <g filter="url(#soft)">
    <rect x="300" y="380" width="130" height="90" rx="12" fill="#1A2218" stroke="#2E3A2A"/>
    <text x="318" y="410" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">CV / ML</text>
    <text x="318" y="430" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">FastAPI :8001</text>
    <text x="318" y="450" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">OCR · face · liveness</text>
  </g>
  <g filter="url(#soft)">
    <rect x="450" y="380" width="130" height="90" rx="12" fill="#1A2218" stroke="#2E3A2A"/>
    <text x="468" y="410" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">TX / ML</text>
    <text x="468" y="430" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">FastAPI :8002</text>
    <text x="468" y="450" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Rules · GBM · SHAP</text>
  </g>
  <g filter="url(#soft)">
    <rect x="620" y="380" width="160" height="90" rx="12" fill="#1A2218" stroke="#2E3A2A"/>
    <ellipse cx="648" cy="420" rx="14" ry="8" fill="none" stroke="#FF4515" stroke-width="2"/>
    <ellipse cx="648" cy="426" rx="14" ry="8" fill="none" stroke="#FF4515" stroke-width="2"/>
    <text x="676" y="418" fill="#F4F7F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">PostgreSQL</text>
    <text x="676" y="438" fill="#8A9480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">Authoritative state</text>
    <text x="640" y="458" fill="#A8B39E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">+ object storage (media)</text>
  </g>

  <!-- Paths -->
  <path id="p1" d="M240 144 H300" stroke="#8A9480" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="p2" d="M240 264 H300" stroke="#8A9480" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="p3" d="M580 210 H720" stroke="#8A9480" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="p4" d="M365 330 V380" stroke="#8A9480" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="p5" d="M515 330 V380" stroke="#8A9480" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path id="p6" d="M540 330 C560 350 600 360 620 400" stroke="#8A9480" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Animated packets -->
  <circle r="4" fill="#FF4515">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M240 144 H300"/>
  </circle>
  <circle r="4" fill="#FF6A33">
    <animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M240 264 H300"/>
  </circle>
  <circle r="4" fill="#FF4515">
    <animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M580 210 H720"/>
  </circle>
  <circle r="3.5" fill="#FFB199">
    <animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite" path="M365 330 V380"/>
  </circle>
  <circle r="3.5" fill="#FFB199">
    <animateMotion dur="2.2s" begin="0.9s" repeatCount="indefinite" path="M515 330 V380"/>
  </circle>
</svg>
