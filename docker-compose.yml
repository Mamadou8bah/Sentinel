# Local infrastructure. Python services are opt-in with --profile inference.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional async transport (enable when RabbitMQ path is implemented)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sentinel-rabbitmq
    profiles: ["async"]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      cv-ml:
        condition: service_healthy
      transaction-ml:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_change_me}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string_at_least_32_chars}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-sentinel-dev-field-key-change-me}
      SENTINEL_ML_STUB: "false"
      CV_ML_BASE_URL: http://cv-ml:8001
      TRANSACTION_ML_BASE_URL: http://transaction-ml:8002
      SENTINEL_PUBLIC_BASE_URL: ${SENTINEL_PUBLIC_BASE_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads

  cv-ml:
    profiles: ["inference", "app"]
    build: ./services/cv-ml
    environment:
      CV_ML_ARTIFACT_DIR: /app/artifacts/identity
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - cv_challenges:/app/runtime
      - ./services/cv-ml/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  transaction-ml:
    profiles: ["inference", "app"]
    build: ./services/transaction-ml
    environment:
      TRANSACTION_ML_MODE: ${TRANSACTION_ML_MODE:-rules}
      TRANSACTION_ML_MODEL_PATH: /app/artifacts/${TRANSACTION_ML_MODEL_ARTIFACT:-paysim/model.joblib}
    volumes:
      - ./services/transaction-ml/artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  cv_challenges:
  uploads:
