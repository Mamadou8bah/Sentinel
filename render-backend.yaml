# Backend-only free Render deployment. See docs/deploy-backends.md.
services:
- type: web
  name: sentinel-api
  runtime: docker
  plan: free
  region: frankfurt
  dockerfilePath: ./backend/Dockerfile
  dockerContext: ./backend
  healthCheckPath: /actuator/health
  envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: render
  - key: JAVA_TOOL_OPTIONS
    value: -XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m
      -Xss512k
  - key: JWT_SECRET
    generateValue: true
  - key: FIELD_ENCRYPTION_KEY
    generateValue: true
  - key: RENDER_DB_HOST
    sync: false
  - key: RENDER_DB_NAME
    sync: false
  - key: POSTGRES_USER
    sync: false
  - key: POSTGRES_PASSWORD
    sync: false
  - key: SENTINEL_CORS_ALLOWED_ORIGINS
    sync: false
  - key: SENTINEL_PUBLIC_BASE_URL
    sync: false
  - key: SENTINEL_ML_ENABLED
    value: 'false'
  - key: SENTINEL_BOOTSTRAP_ENABLED
    value: 'false'
